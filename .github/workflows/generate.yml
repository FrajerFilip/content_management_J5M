name: Generate Reels / TikTok video

# Název běhu obsahuje request_id, podle kterého si webová aplikace najde „svůj“ běh
run-name: "Generate video ${{ inputs.request_id || github.event.client_payload.request_id || github.event_name }}"

on:
  # Ruční spuštění z GitHub UI (záložka Actions) nebo z webové aplikace přes API:
  #   POST /repos/<owner>/<repo>/actions/workflows/generate.yml/dispatches
  #   body: {"ref": "main", "inputs": {"slides": "<JSON>", "options": "<JSON>", "request_id": "abc"}}
  workflow_dispatch:
    inputs:
      slides:
        description: "JSON pole 4 snímků [{tag, heading, mainText, voiceover, imageUrl}] – prázdné = výchozí scénář"
        required: false
        default: ""
      options:
        description: 'Nastavení, např. {"voice":"auto","gender":"male","speed":1,"music":true,"captions":true} – voice: auto | elevenlabs | azure | openai | piper | none'
        required: false
        default: ""
      request_id:
        description: "Identifikátor požadavku (vyplňuje webová aplikace)"
        required: false
        default: ""

  # Spuštění přes webhook / REST API:
  #   POST /repos/<owner>/<repo>/dispatches
  #   body: {"event_type": "generate-video", "client_payload": {"slides": [...], "options": {...}, "request_id": "abc"}}
  repository_dispatch:
    types: [generate-video]

  # Po změně webu / šablony / skriptu se web znovu nasadí (s ukázkovým videem)
  push:
    branches: [main]
    paths:
      - "web/**"
      - "lib/**"
      - "template.html"
      - "presets.json"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate.yml"

permissions:
  contents: read

concurrency:
  group: generate-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIPER_VOICE: cs_CZ-jirka-medium
      PIPER_DATA_DIR: ${{ github.workspace }}/voices

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalace FFmpeg a fontů
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-noto-core
          ffmpeg -version | head -n 1

      - name: Instalace NPM závislostí
        run: npm install --no-audit --no-fund

      - name: Nastavení Pythonu (hlas Piper)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalace Piper TTS
        run: pip install --disable-pip-version-check piper-tts

      - name: Mezipaměť hlasového modelu
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-${{ env.PIPER_VOICE }}-v1

      - name: Stažení českého hlasu
        run: |
          if [ ! -f "voices/${PIPER_VOICE}.onnx" ]; then
            python -m piper.download_voices --download-dir voices "${PIPER_VOICE}"
          fi
          ls -la voices

      - name: Spuštění generátoru
        env:
          # Data jdou přes proměnné prostředí (ne přímo do shellu) – bezpečné vůči injekci
          SLIDES_JSON: ${{ inputs.slides || toJson(github.event.client_payload.slides) }}
          OPTIONS_JSON: ${{ inputs.options || toJson(github.event.client_payload.options) }}
          REQUEST_ID: ${{ inputs.request_id || github.event.client_payload.request_id }}
          # Volitelné prémiové hlasy – stačí přidat v Settings → Secrets and variables → Actions
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_TTS_VOICE: ${{ vars.AZURE_TTS_VOICE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
        run: node index.js

      - name: Nahrání videa jako artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: reels-video-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14

      - name: Sestavení webu (aplikace + poslední video)
        run: |
          mkdir -p _site/videos
          cp -r web/. _site/
          cp template.html _site/template.html
          cp presets.json _site/presets.json
          cp output/reels-output.mp4 output/cover.jpg output/captions.srt _site/videos/
          cp output/latest.json _site/latest.json

      - name: Nahrání webu pro GitHub Pages
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
